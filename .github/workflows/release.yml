# Builds the fork's images from a tag on the gathering branch, e.g.
# v0.6.3-gathering.1, and pushes them to ghcr.io/<owner>/<image>:<tag>.
name: release
on:
  push:
    tags:
      - "v*-gathering.*"
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Vet
        run: go vet ./...
      - name: Test the runner
        run: go test ./internal/runner/... ./cmd/...
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w \
                -X github.com/leg100/otf/internal.Version=${GITHUB_REF_NAME} \
                -X github.com/leg100/otf/internal.Commit=${GITHUB_SHA} \
                -X github.com/leg100/otf/internal.Built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o ./_build/linux/$arch/ \
              ./cmd/otfd ./cmd/otf-job ./cmd/otf-agent
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for target in otfd otf-agent otf-job; do
            docker buildx build \
              --file Dockerfile \
              --target "$target" \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
              --tag "${registry}/${target}:${GITHUB_REF_NAME}" \
              --push \
              ./_build/
          done
          {
            echo "### Images"
            for target in otfd otf-agent otf-job; do
              echo "- \`${registry}/${target}:${GITHUB_REF_NAME}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
